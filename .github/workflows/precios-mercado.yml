name: Precios de mercado

on:
  schedule:
    - cron: "47 11 * * *"   # todos los días 8:47 (hora Argentina)
  workflow_dispatch: {}     # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar precios
        run: python3 precios_mercado.py
      - name: Guardar
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add precios-mercado.json
          git diff --cached --quiet || git commit -m "Precios de mercado $(date -u +%F)"
          git push
