<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2a44">
<title>Raspa y gana · Ice King</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❄️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Raspa y gana: la tarjeta está tapada por una capa de hielo que se raspa con el dedo.
   Misma marca que el catálogo y la sala del sorteo: hielo, tinta y la etiqueta amarilla. */
:root{
  --frost:#e6f0f5; --ink:#0e2a44; --muted:#4f6a80; --line:rgba(14,42,68,.14);
  --led:#13b5ea; --tag:#ffd23f; --tag-ink:#3a2a00; --wa:#14a85a;
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif; --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--frost)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(120% 70% at 50% 0%,#fff 0%,var(--frost) 70%)}
a,button{font:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--led);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:460px;margin:0 auto;padding:22px 18px 48px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.brand span{color:var(--led)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,14vw,64px);line-height:.9;margin:22px 0 10px;text-transform:uppercase}
.lead{margin:0 0 22px;color:var(--muted);max-width:38ch}

/* la tarjeta */
.ticket{position:relative;border-radius:22px;background:var(--ink);color:#fff;padding:14px;box-shadow:0 30px 60px -30px rgba(14,42,68,.7)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--frost)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.field{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:5/4;background:#fff;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.prize{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:18px;gap:6px}
.prize .big{font-family:var(--display);font-weight:900;font-size:clamp(76px,26vw,112px);line-height:.85}
.prize .what{font-weight:600;font-size:17px;max-width:24ch}
.prize .thanks{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,54px);line-height:.92;text-transform:uppercase}
.prize .code{margin-top:8px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:2px 14px;transform:rotate(-2deg)}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;transition:opacity .6s ease}
canvas.gone{opacity:0;pointer-events:none}
.stub{display:flex;justify-content:space-between;gap:12px;padding:12px 6px 2px;font-size:13px;color:#a9c3d6}
.stub b{color:#fff;font-weight:600}

.after{margin-top:22px;display:grid;gap:12px}
.after p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 20px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.wa{background:var(--wa);color:#fff}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--line)}
.small{font-size:14px;color:var(--muted)}
.msg{margin-top:40px;font-size:17px}
@media (prefers-reduced-motion:reduce){canvas{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app"><a class="brand" href="https://vapdm-ba.web.app/">Ice <span>King</span></a><p class="msg">Cargando tu tarjeta…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Z"/></svg>';
const CAT='https://vapdm-ba.web.app/';
const brand=`<a class="brand" href="${CAT}">Ice <span>King</span></a>`;
const fechaCorta=iso=>{ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}`; };
const hoy=()=>{ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const fail=t=>{ $('app').innerHTML=`${brand}<h1>Ups</h1><p class="lead">${t}</p><a class="btn plain" href="${CAT}">Ver el catálogo</a>`; };

const token=new URLSearchParams(location.search).get('c')||'';
if(!/^[a-z0-9]{12,40}$/.test(token)) return fail('Este link no es válido. Usá el link que te llegó por WhatsApp.');

firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.firestore();
let R=null, tel=null;

Promise.all([
  db.doc('raspa/'+token).get(),
  db.doc('catalogo/actual').get().catch(()=>null)
]).then(([d,cat])=>{
  if(!d.exists) return fail('Esta tarjeta no existe o el juego ya terminó.');
  R=d.data(); tel=cat&&cat.exists?String(cat.data().telefono||'').replace(/\D/g,''):null;
  draw();
}).catch(e=>{ console.error(e); fail('No pudimos cargar tu tarjeta. Revisá tu conexión y volvé a abrir el link.'); });

function prizeHTML(){
  if(R.premio==='10off') return `<div class="big">10%</div><div class="what">de descuento en tu próxima compra</div><div class="code">${esc(R.codigo)}</div>`;
  return `<div class="thanks">¡Gracias por participar!</div><div class="what">Esta vez no hubo premio. Se vienen más sorteos.</div>`;
}
function afterHTML(){
  const nombre=String(R.nombre||'').split(' ')[0];
  if(R.premio==='10off'){
    const vencido=R.vence && hoy()>R.vence;
    const txt=`¡Hola! Soy ${nombre}. Gané 10% OFF en el Raspa y Gana, mi código es ${R.codigo}`;
    return `<p><b>¡Ganaste, ${esc(nombre)}!</b> Pasá tu código cuando hagas tu próximo pedido. ${R.vence?`Vale hasta el ${fechaCorta(R.vence)}`:''}, una sola vez.</p>
      ${vencido?'<p class="small">Este código ya venció.</p>':(tel?`<a class="btn wa" href="https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${WA}Usar mi descuento</a>`:'')}
      <a class="btn plain" href="${CAT}">Ver sabores en stock</a>
      <p class="small">Sacale captura a esta pantalla por las dudas.</p>`;
  }
  return `<p>Gracias por sumarte al sorteo, ${esc(nombre)}. Seguí atento al catálogo para los próximos.</p>
    <a class="btn plain" href="${CAT}">Ver sabores en stock</a>`;
}
function draw(){
  const nombre=String(R.nombre||'').split(' ')[0];
  const ya=!!R.raspado;
  $('app').innerHTML=`${brand}
    <h1>${ya?'Tu tarjeta':'Raspá el hielo'}</h1>
    <p class="lead">${ya?'Ya raspaste esta tarjeta. Así salió:':`${esc(nombre)}, esta tarjeta es tuya y se raspa una sola vez. Pasá el dedo por el hielo para ver qué te tocó.`}</p>
    <div class="ticket"><div class="field" id="field"><div class="prize">${prizeHTML()}</div>${ya?'':'<canvas id="cv" aria-label="Capa de hielo para raspar"></canvas>'}</div>
      <div class="stub"><span>Raspa y gana</span><b>${esc(R.nombre||'')}</b></div></div>
    <div class="after" id="after" ${ya?'':'hidden'}>${afterHTML()}</div>
    ${ya?'':'<p class="small" id="hint" style="margin-top:16px">¿No podés raspar? <button class="btn plain" style="padding:6px 12px;font-size:14px" id="reveal">Destapar de una</button></p>'}`;
  if(!ya) scratch();
}

// capa de hielo: escarcha azulada con vetas y cristales, dibujada en el canvas
function scratch(){
  const cv=$('cv'), field=$('field'), ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1); let W,H;
  function paint(){
    const r=field.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#cfe6f2'); g.addColorStop(.5,'#eef7fb'); g.addColorStop(1,'#b9d9ea');
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // grano de escarcha
    for(let i=0;i<W*H/14;i++){ ctx.fillStyle=`rgba(255,255,255,${Math.random()*.55})`; ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2); }
    // vetas del hielo
    ctx.lineCap='round';
    for(let i=0;i<26;i++){ ctx.strokeStyle=`rgba(${Math.random()<.5?'255,255,255':'120,170,200'},${.25+Math.random()*.35})`; ctx.lineWidth=.6+Math.random()*1.4;
      let x=Math.random()*W, y=Math.random()*H; ctx.beginPath(); ctx.moveTo(x,y);
      for(let k=0;k<4;k++){ x+=(Math.random()-.5)*90; y+=(Math.random()-.5)*60; ctx.lineTo(x,y); } ctx.stroke(); }
    // copos
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.4;
    for(let i=0;i<9;i++){ const x=Math.random()*W, y=Math.random()*H, s=5+Math.random()*9;
      for(let a=0;a<3;a++){ const t=a*Math.PI/3; ctx.beginPath(); ctx.moveTo(x-Math.cos(t)*s,y-Math.sin(t)*s); ctx.lineTo(x+Math.cos(t)*s,y+Math.sin(t)*s); ctx.stroke(); } }
    ctx.fillStyle='rgba(14,42,68,.78)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`900 ${Math.round(W/7)}px "Big Shoulders Display", "Arial Narrow", sans-serif`; ctx.fillText('RASPÁ ACÁ',W/2,H/2-8);
    ctx.font=`600 ${Math.max(13,Math.round(W/24))}px "Work Sans", sans-serif`; ctx.fillText('con el dedo o el mouse',W/2,H/2+W/14);
  }
  (document.fonts?document.fonts.ready:Promise.resolve()).then(paint);
  let down=false, last=null, done=false, moves=0;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  function line(a,b){ ctx.globalCompositeOperation='destination-out'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=Math.max(34,W/9);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  function cleared(){ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let n=0,t=0; for(let i=3;i<d.length;i+=64){ t++; if(d[i]<40) n++; } return n/t; }
  cv.addEventListener('pointerdown',e=>{ down=true; last=pos(e); cv.setPointerCapture(e.pointerId); line(last,{x:last.x+.1,y:last.y}); });
  cv.addEventListener('pointermove',e=>{ if(!down||done) return; const p=pos(e); line(last,p); last=p; if(++moves%12===0 && cleared()>.5) reveal(); });
  const up=()=>{ down=false; if(!done && cleared()>.5) reveal(); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  $('reveal').onclick=reveal;
  function reveal(){
    if(done) return; done=true; cv.classList.add('gone'); $('hint')?.remove(); $('after').hidden=false;
    db.doc('raspa/'+token).update({raspado:true, raspadoEn:Date.now()}).catch(e=>console.error('raspado',e));
    setTimeout(()=>$('after').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}),400);
  }
}
})();
</script>
</body>
</html>
