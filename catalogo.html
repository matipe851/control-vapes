<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#13121c">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mobile-first: header, flavor grid (1 col phone → 2–3 cols wide), sticky cart bar at the bottom */
:root{
  --bg:#13121c; --surface:#1c1b28; --surface-2:#262536; --fg:#ecebf5; --muted:#a09fb8; --line:#33324a;
  --accent:#a985ec; --accent-fg:#16121f; --ice:#6cc4e3; --wa:#25d366; --warn:#f0b357; --bad:#f07c7c;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}
header{padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:18px;display:grid;gap:8px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice);font-weight:700}
header h1{font-size:clamp(28px,7vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
header p{margin:0;color:var(--muted)}
.promo{margin:4px 0 0;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 28%,transparent),color-mix(in srgb,var(--ice) 22%,transparent));border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;white-space:pre-line}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.card.in{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.emo{min-width:56px;height:56px;padding:0 8px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;line-height:1;white-space:nowrap;letter-spacing:-2px}
.card h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.ice{background:color-mix(in srgb,var(--ice) 18%,transparent);color:var(--ice)}
.tag.low{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-family:var(--display);font-size:20px;font-weight:600}
.qty{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.qty button{width:36px;height:36px;border:0;border-radius:8px;background:transparent;font-size:20px;font-weight:600}
.qty button:hover{background:var(--line)}
.qty span{min-width:22px;text-align:center;font-weight:700}
.add{border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:9px 16px}
.empty,.msg{color:var(--muted);text-align:center;padding:40px 0}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cart-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.cart small{display:block;color:var(--muted);font-size:12.5px}
.cart b{font-family:var(--display);font-size:20px}
.wa{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#08260f;border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;white-space:nowrap}
.wa[aria-disabled="true"]{opacity:.45;pointer-events:none}
.wa svg{width:18px;height:18px;fill:currentColor}
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding:28px 0 8px}
/* age gate */
.gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.gate-card{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:grid;gap:14px;text-align:center}
.gate-card h2{font-size:22px}
.gate-card p{margin:0;color:var(--muted);font-size:14px}
.gate-btns{display:grid;gap:8px}
.gate-btns button{border-radius:10px;padding:12px;font-weight:700;border:1px solid var(--line);background:transparent}
.gate-btns button.yes{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <h2>¿Sos mayor de 18 años?</h2>
    <p>Este catálogo contiene productos con nicotina, solo para mayores de edad.</p>
    <div class="gate-btns"><button class="yes" id="gate-yes">Sí, soy mayor de 18</button><button id="gate-no">No</button></div>
  </div>
</div>

<header class="wrap">
  <span class="kicker">Catálogo · stock al día</span>
  <h1 id="titulo">ELF BAR ICE KING 40K PUFF</h1>
  <p id="sub">Elegí tus sabores y mandanos el pedido por WhatsApp.</p>
  <div class="promo" id="promo" hidden></div>
</header>

<main class="wrap">
  <div class="filters" role="group" aria-label="Filtrar">
    <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-f="ice" aria-pressed="false">❄️ Ice</button>
    <button class="chip" data-f="noice" aria-pressed="false">Sin hielo</button>
  </div>
  <div id="list"><p class="msg">Cargando sabores…</p></div>
  <p class="foot" id="upd"></p>
</main>

<div class="cart" id="cart">
  <div class="cart-in">
    <div><small id="cart-n">Tu pedido está vacío</small><b class="num" id="cart-t">$ 0</b></div>
    <a class="wa" id="cart-wa" href="#" target="_blank" rel="noopener" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>Pedir por WhatsApp</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(v||0);
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
let CAT=null, cart={}, filtro='todos';
try{ cart=JSON.parse(ls.get('cat_cart')||'{}')||{}; }catch(e){ cart={}; }

// age gate
if(ls.get('cat_18')!=='1') $('gate').hidden=false;
$('gate-yes').onclick=()=>{ ls.set('cat_18','1'); $('gate').hidden=true; };
$('gate-no').onclick=()=>{ document.body.innerHTML='<p class="msg" style="padding:80px 16px">Este catálogo es solo para mayores de 18 años.</p>'; };

document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filtro=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); render(); });

function items(){ return (CAT?.items||[]); }
function render(){
  if(!CAT) return;
  if(CAT.activo===false){ $('list').innerHTML='<p class="msg">El catálogo no está disponible en este momento. Escribinos por WhatsApp.</p>'; updCart(); return; }
  $('titulo').textContent = CAT.titulo || 'ELF BAR ICE KING 40K PUFF';
  $('promo').hidden = !CAT.promo; $('promo').textContent = CAT.promo || '';
  // drop items no longer in stock from the cart
  const ids=new Set(items().map(i=>i.id)); for(const k of Object.keys(cart)) if(!ids.has(k)) delete cart[k];
  const list=items().filter(i=> filtro==='todos' || (filtro==='ice'? i.ice : !i.ice));
  $('list').innerHTML = list.length ? `<div class="grid">${list.map(i=>{ const q=cart[i.id]||0; return `
    <article class="card ${q?'in':''}">
      <div class="emo" aria-hidden="true">${esc(i.emoji||'💨')}</div>
      <div><h2>${esc(i.sabor)}</h2><div class="meta">${i.ice?'<span class="tag ice">❄️ Ice</span>':''}${i.pocas?'<span class="tag low">Últimas unidades</span>':''}</div></div>
      <div class="row"><span class="price num">${i.precio?money(i.precio):'Consultar'}</span>
        ${q?`<div class="qty"><button data-m="${esc(i.id)}" aria-label="Quitar uno de ${esc(i.sabor)}">−</button><span class="num">${q}</span><button data-p="${esc(i.id)}" aria-label="Agregar uno de ${esc(i.sabor)}" ${i.max && q>=i.max?'disabled':''}>+</button></div>`
           :`<button class="add" data-p="${esc(i.id)}">Agregar</button>`}
      </div>
    </article>`; }).join('')}</div>` : `<p class="empty">${items().length?'No hay sabores en este filtro.':'Por ahora no hay sabores en stock. Escribinos y te avisamos cuando lleguen.'}</p>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const it=items().find(x=>x.id===b.dataset.p); const q=(cart[it.id]||0)+1; if(it.max && q>it.max) return; cart[it.id]=q; save(); render(); });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const k=b.dataset.m; cart[k]=(cart[k]||0)-1; if(cart[k]<=0) delete cart[k]; save(); render(); });
  if(CAT.actualizado){ const d=new Date(CAT.actualizado); $('upd').textContent=`Stock actualizado: ${d.toLocaleDateString('es-AR')} ${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`; }
  updCart();
}
function save(){ ls.set('cat_cart', JSON.stringify(cart)); }
function updCart(){
  const sel=items().filter(i=>cart[i.id]);
  const u=sel.reduce((a,i)=>a+cart[i.id],0), t=sel.reduce((a,i)=>a+cart[i.id]*(i.precio||0),0);
  $('cart-n').textContent = u ? `${u} unidad${u===1?'':'es'}` : 'Tu pedido está vacío';
  $('cart-t').textContent = money(t);
  const tel=String(CAT?.telefono||'').replace(/\D/g,'');
  const a=$('cart-wa');
  if(u && tel){
    const txt=`Hola! Quiero hacer este pedido:\n\n${sel.map(i=>`• ${cart[i.id]} × ${i.sabor} ${i.emoji||''}${i.ice?'❄️':''}`).join('\n')}\n\nTotal: ${money(t)}`;
    a.href=`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(txt)}`; a.setAttribute('aria-disabled','false');
  } else { a.href='#'; a.setAttribute('aria-disabled','true'); }
}

try{
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.firestore().doc('catalogo/actual').onSnapshot(d=>{
    CAT = d.exists ? d.data() : {items:[]}; render();
  }, err=>{ console.error(err); $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo. Probá de nuevo en un rato.</p>'; });
}catch(e){ $('list').innerHTML='<p class="msg">No se pudo cargar el catálogo.</p>'; }
})();
</script>
</body>
</html>
